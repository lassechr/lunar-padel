<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lunar Padel – Admin</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-border: #334155;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --accent: #38bdf8;
    --danger: #f97316;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 1rem;
  }
  h1 { font-size: 1.4rem; max-width: 700px; margin: 0 auto 0.3rem; }
  .subtitle { max-width: 700px; margin: 0 auto 1.5rem; color: var(--text-dim); font-size: 0.85rem; }

  .password-bar {
    max-width: 700px;
    margin: 0 auto 1.5rem;
    display: flex;
    gap: 0.5rem;
  }
  .password-bar input {
    flex: 1;
    padding: 0.6rem;
    border-radius: 8px;
    border: 1px solid var(--card-border);
    background: var(--card);
    color: var(--text);
  }

  section { max-width: 700px; margin: 0 auto 2rem; }
  section h2 { font-size: 1rem; color: var(--text-dim); margin-bottom: 0.6rem; }

  .search-box {
    width: 100%;
    padding: 0.6rem;
    border-radius: 8px;
    border: 1px solid var(--card-border);
    background: var(--card);
    color: var(--text);
    margin-bottom: 0.8rem;
    box-sizing: border-box;
  }

  .row {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 0.7rem 0.9rem;
    margin-bottom: 0.5rem;
  }
  .row-main {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.6rem;
    flex-wrap: wrap;
  }
  .row-teams { font-weight: 600; font-size: 0.9rem; }
  .row-date { color: var(--accent); font-size: 0.82rem; font-weight: 600; }
  .row-override { color: var(--danger); font-size: 0.78rem; margin-top: 0.2rem; }

  button {
    padding: 0.4rem 0.8rem;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #0f172a;
    font-weight: 700;
    cursor: pointer;
    font-size: 0.8rem;
  }
  button.remove { background: var(--danger); }
  button.small { padding: 0.3rem 0.6rem; }

  .edit-panel {
    margin-top: 0.6rem;
    display: none;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .edit-panel.open { display: flex; }
  .edit-panel input {
    padding: 0.5rem;
    border-radius: 8px;
    border: 1px solid var(--card-border);
    background: #0f172a;
    color: var(--text);
    flex: 1;
    min-width: 140px;
  }

  #status { max-width: 700px; margin: 0 auto 1rem; font-size: 0.85rem; }
  .empty { color: var(--text-dim); font-size: 0.85rem; padding: 1rem; text-align: center; }
</style>
</head>
<body>

<h1>Lunar Padel – Admin</h1>
<p class="subtitle">Ret forkerte datoer/tidspunkter fra RankedIn</p>

<div class="password-bar">
  <input id="secret" type="password" placeholder="Adgangskode">
</div>

<div id="status"></div>

<section>
  <h2>Aktive rettelser</h2>
  <div id="overridesList"><div class="empty">Ingen aktive rettelser</div></div>
</section>

<section>
  <h2>Kommende kampe</h2>
  <input class="search-box" id="searchBox" type="text" placeholder="Søg efter hold…">
  <div id="matchesList"><div class="empty">Henter kampe…</div></div>
</section>

<script>
let allMatches = [];
let overrides = {};

async function loadData() {
  const [matchesRes, overridesRes] = await Promise.all([
    fetch('/api/matches').then(r => r.json()),
    fetch('/api/get-overrides').then(r => r.json())
  ]);
  allMatches = (matchesRes.matches || []).filter(m => m.result === null);
  overrides = overridesRes.overrides || {};
  renderOverrides();
  renderMatches();
}

function renderOverrides() {
  const container = document.getElementById('overridesList');
  const entries = Object.entries(overrides);
  if (entries.length === 0) {
    container.innerHTML = '<div class="empty">Ingen aktive rettelser</div>';
    return;
  }
  container.innerHTML = entries.map(([matchId, o]) => {
    const match = allMatches.find(m => String(m.matchId) === String(matchId));
    const label = match ? `${match.homeTeam} vs ${match.awayTeam}` : `Match ID ${matchId}`;
    return `
      <div class="row">
        <div class="row-main">
          <div>
            <div class="row-teams">${label}</div>
            <div class="row-override">Rettet til: ${o.date} · ${o.time.split(' ')[1] || ''}</div>
          </div>
          <button class="remove small" onclick="removeOverride('${matchId}')">Fjern</button>
        </div>
      </div>
    `;
  }).join('');
}

function renderMatches() {
  const query = document.getElementById('searchBox').value.toLowerCase();
  const container = document.getElementById('matchesList');

  const filtered = allMatches.filter(m =>
    m.homeTeam.toLowerCase().includes(query) || m.awayTeam.toLowerCase().includes(query)
  ).slice(0, 50);

  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty">Ingen kampe matcher søgningen</div>';
    return;
  }

  container.innerHTML = filtered.map(m => `
    <div class="row">
      <div class="row-main">
        <div>
          <div class="row-teams">${m.homeTeam} vs ${m.awayTeam}</div>
          <div class="row-date">${m.date} · ${m.time.split(' ')[1] || ''}</div>
        </div>
        <button class="small" onclick="toggleEdit(${m.matchId})">✏️ Ret dato</button>
      </div>
      <div class="edit-panel" id="edit-${m.matchId}">
        <input id="date-${m.matchId}" type="text" placeholder="DD/MM/ÅÅÅÅ" value="${m.date}">
        <input id="time-${m.matchId}" type="text" placeholder="DD/MM/ÅÅÅÅ TT:MM" value="${m.time}">
        <button onclick="saveOverride(${m.matchId})">Gem</button>
      </div>
    </div>
  `).join('');
}

function toggleEdit(matchId) {
  document.querySelectorAll('.edit-panel').forEach(p => p.classList.remove('open'));
  document.getElementById(`edit-${matchId}`).classList.add('open');
}

async function saveOverride(matchId) {
  const date = document.getElementById(`date-${matchId}`).value;
  const time = document.getElementById(`time-${matchId}`).value;
  await callApi({ matchId, date, time });
}

async function removeOverride(matchId) {
  await callApi({ matchId: Number(matchId), remove: true });
}

async function callApi(payload) {
  const secret = document.getElementById('secret').value;
  const status = document.getElementById('status');
  status.textContent = 'Gemmer…';
  try {
    const res = await fetch('/api/set-override', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ secret, ...payload })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Fejl');
    status.textContent = '✅ Gemt!';
    await loadData();
  } catch (err) {
    status.textContent = '❌ ' + err.message;
  }
}

document.getElementById('searchBox').addEventListener('input', renderMatches);

loadData();
</script>

</body>
</html>
