<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lunar Padel – SHI Hjørring holdkampe</title>
<meta property="og:title" content="SHI Hjørring Padel – Kampoversigt">
<meta property="og:description" content="Overblik over holdkampe – hjemme og ude">
<meta property="og:image" content="https://lunar.purepadel.dk/og-image.png">
<meta property="og:url" content="https://lunar.purepadel.dk">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon-32x32.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-border: #334155;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --accent: #38bdf8;
    --home: #22c55e;
    --away: #f97316;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 1rem;
  }
  header {
    max-width: 900px;
    margin: 0 auto 1.5rem;
    text-align: center;
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 900px;
    margin: 0 auto 1rem;
  }
  .club-logo {
    height: 48px;
    width: auto;
  }
  .shop-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--text);
    padding: 0.5rem 0.9rem;
    border-radius: 999px;
    font-size: 0.8rem;
    text-decoration: none;
    font-weight: 600;
  }
  .shop-badge:hover {
    border-color: var(--accent);
  }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 0.25rem;
  }
  header p {
    color: var(--text-dim);
    margin: 0;
    font-size: 0.9rem;
  }
  .filters {
    max-width: 900px;
    margin: 0 auto 1.5rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    justify-content: center;
  }
  .filter-group {
    display: flex;
    gap: 0.25rem;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 0.25rem;
  }
  .filter-group button {
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 0.4rem 0.8rem;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .filter-group button.active {
    background: var(--accent);
    color: #0f172a;
    font-weight: 600;
  }
  .week-toggle {
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--text-dim);
    padding: 0.55rem 0.9rem;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .week-toggle.active {
    background: var(--accent);
    color: #0f172a;
    border-color: var(--accent);
  }
  select {
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--text);
    padding: 0.5rem 0.75rem;
    border-radius: 10px;
    font-size: 0.85rem;
  }
  .matches {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }
  .date-heading {
    font-size: 0.78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    margin: 1.2rem 0 0.2rem;
    padding-left: 0.2rem;
  }
  .date-heading:first-child {
    margin-top: 0;
  }
  .match-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 0.9rem 1rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .match-teams {
    font-weight: 600;
    font-size: 0.95rem;
  }
  .match-teams .vs { color: var(--text-dim); font-weight: 400; }
  .match-division {
    display: inline-block;
    color: var(--text-dim);
    font-size: 0.72rem;
    background: rgba(148, 163, 184, 0.12);
    padding: 0.1rem 0.5rem;
    border-radius: 999px;
    margin-top: 0.25rem;
  }
  .match-date {
    color: var(--accent);
    font-size: 0.85rem;
    font-weight: 700;
    margin-top: 0.3rem;
  }
  .match-location {
    color: var(--text-dim);
    font-size: 0.78rem;
    margin-top: 0.15rem;
  }
  .badge {
    font-size: 0.7rem;
    font-weight: 700;
    padding: 0.2rem 0.55rem;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .badge.home { background: rgba(34,197,94,0.15); color: var(--home); }
  .badge.away { background: rgba(249,115,22,0.15); color: var(--away); }
  .result {
    font-weight: 700;
    font-size: 1rem;
    min-width: 60px;
    text-align: right;
  }
  .empty, .loading {
    text-align: center;
    color: var(--text-dim);
    padding: 2rem;
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <img src="/logo.png" alt="SHI Hjørring Padel logo" class="club-logo">
    <a href="https://purepadel.dk" target="_blank" rel="noopener" class="shop-badge">
      <img src="/picon.png" alt="" style="height:18px;width:auto;">
      Se padeludstyr på PurePadel.dk
    </a>
  </div>
  <h1>SHI Hjørring Padel</h1>
  <p>Overblik over holdkampe – hjemme og ude</p>
</header>

<div class="filters">
  <button id="week-toggle" class="week-toggle">📅 Denne uge</button>
  <button id="standings-jump" class="week-toggle">📊 Stillinger</button>
  <div class="filter-group" id="filter-side">
    <button data-value="all" class="active">Alle</button>
    <button data-value="home">Hjemme</button>
    <button data-value="away">Ude</button>
  </div>
  <div class="filter-group" id="filter-category">
    <button data-value="all" class="active">Alle</button>
    <button data-value="herrer">Herrer</button>
    <button data-value="damer">Damer</button>
  </div>
  <div class="filter-group" id="filter-status">
    <button data-value="all">Alle</button>
    <button data-value="upcoming" class="active">Kommende</button>
    <button data-value="played">Spillede</button>
  </div>
  <select id="filter-team">
    <option value="all">Alle hold</option>
  </select>
</div>

<div class="matches" id="matches">
  <div class="loading">Henter kampe…</div>
</div>

<section id="standings-section" style="max-width:900px; margin: 2rem auto; padding-top: 1rem;">
  <h2 style="font-size:1.1rem; color:var(--text-dim); margin-bottom:0.8rem;">Stillinger på RankedIn</h2>
  <div id="standingsList" class="matches"></div>
</section>

<script>
let allMatches = [];
let teamsIndex = [];
let state = { side: 'all', category: 'all', team: 'all', status: 'upcoming', thisWeek: false };

const WEEKDAYS = ['søndag','mandag','tirsdag','onsdag','torsdag','fredag','lørdag'];
const MONTHS = ['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];

function parseMatchDateTime(m) {
  const [day, month, year] = m.date.split('/').map(Number);
  const timePart = (m.time.split(' ')[1] || '00:00');
  const [hour, minute] = timePart.split(':').map(Number);
  return new Date(year, month - 1, day, hour, minute).getTime();
}

function getDateKey(m) {
  return m.date; // "DD/MM/ÅÅÅÅ" er allerede unik pr. dag
}

function getDateHeading(m) {
  const [day, month, year] = m.date.split('/').map(Number);
  const matchDay = new Date(year, month - 1, day);
  const today = new Date();
  today.setHours(0,0,0,0);

  const diffDays = Math.round((matchDay - today) / (1000 * 60 * 60 * 24));

  if (diffDays === 0) return 'I dag';
  if (diffDays === 1) return 'I morgen';
  if (diffDays === -1) return 'I går';

  const weekday = WEEKDAYS[matchDay.getDay()];
  return `${weekday.charAt(0).toUpperCase() + weekday.slice(1)} ${day}. ${MONTHS[month-1]}`;
}

async function loadMatches() {
  try {
    const res = await fetch('/api/matches');
    const data = await res.json();
    allMatches = data.matches || [];
    teamsIndex = data.teamsIndex || [];
    populateTeamDropdown();
    renderStandingsLinks();
    render();
  } catch (err) {
    document.getElementById('matches').innerHTML =
      '<div class="empty">Kunne ikke hente kampe lige nu.</div>';
  }
}

function populateTeamDropdown() {
  const teamCategory = {};
  allMatches.forEach(m => { teamCategory[m.team] = m.category; });

  const teams = [...new Set(allMatches.flatMap(m => m.teams || [m.team]))];

  teams.sort((a, b) => {
    const catA = teamCategory[a] === 'herrer' ? 0 : 1;
    const catB = teamCategory[b] === 'herrer' ? 0 : 1;
    if (catA !== catB) return catA - catB;

    const numA = parseInt((a.match(/\d+/g) || []).pop() || 0, 10);
    const numB = parseInt((b.match(/\d+/g) || []).pop() || 0, 10);
    if (numA !== numB) return numA - numB;
    return a.localeCompare(b);
  });

  const select = document.getElementById('filter-team');
  teams.forEach(team => {
    const opt = document.createElement('option');
    opt.value = team;
    opt.textContent = team;
    select.appendChild(opt);
  });
}

function renderStandingsLinks() {
  const teams = [...teamsIndex].sort((a, b) => {
    const catA = a.name.toLowerCase().includes('dame') ? 1 : 0;
    const catB = b.name.toLowerCase().includes('dame') ? 1 : 0;
    if (catA !== catB) return catA - catB;
    const numA = parseInt((a.name.match(/\d+/g) || []).pop() || 0, 10);
    const numB = parseInt((b.name.match(/\d+/g) || []).pop() || 0, 10);
    return numA - numB;
  });

  const container = document.getElementById('standingsList');
  container.innerHTML = teams.map(t => `
    <a href="https://rankedin.com/en/team/homepage/${t.id}" target="_blank" rel="noopener"
       style="display:flex; justify-content:space-between; align-items:center; background:var(--card); border:1px solid var(--card-border); border-radius:12px; padding:0.8rem 1rem; text-decoration:none; color:var(--text);">
      <span>${t.name}</span>
      <span style="color:var(--accent);">↗</span>
    </a>
  `).join('');
}

function formatTime(timeStr) {
  const parts = timeStr.split(' ');
  return parts[1] || '';
}

function render() {
  const now = Date.now();
  const weekAhead = now + 8 * 24 * 60 * 60 * 1000;

  const filtered = allMatches.filter(m => {
    if (state.side === 'home' && !m.isHomeMatch) return false;
    if (state.side === 'away' && m.isHomeMatch) return false;
    if (state.category !== 'all' && m.category !== state.category) return false;
    if (state.team !== 'all' && !(m.teams || [m.team]).includes(state.team)) return false;
    if (state.status === 'upcoming' && !(m.result === null && parseMatchDateTime(m) > now)) return false;
    if (state.status === 'played' && m.result === null) return false;
    if (state.thisWeek) {
      const t = parseMatchDateTime(m);
      if (t < now || t > weekAhead) return false;
    }
    return true;
  });

  const container = document.getElementById('matches');

  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty">Ingen kampe matcher dine filtre.</div>';
    return;
  }

  let html = '';
  let lastDateKey = null;

  for (const m of filtered) {
    const dateKey = getDateKey(m);
    if (dateKey !== lastDateKey) {
      html += `<div class="date-heading">${getDateHeading(m)}</div>`;
      lastDateKey = dateKey;
    }
    html += `
      <div class="match-card">
        <div>
          <div class="match-teams">
            ${m.homeTeam} <span class="vs">vs</span> ${m.awayTeam}
          </div>
          ${m.division ? `<div class="match-division">${m.division}</div>` : ''}
          <div class="match-date">${formatTime(m.time)}</div>
          <div class="match-location">${m.location || 'Lokation ukendt'}</div>
        </div>
        <div style="display:flex; align-items:center; gap:0.75rem;">
          <span class="badge ${m.isHomeMatch ? 'home' : 'away'}">
            ${m.isHomeMatch ? 'Hjemme' : 'Ude'}
          </span>
          <span class="result">${m.result || '–'}</span>
        </div>
      </div>
    `;
  }

  container.innerHTML = html;
}

function setupFilterGroup(id, key) {
  const group = document.getElementById(id);
  group.addEventListener('click', (e) => {
    if (e.target.tagName !== 'BUTTON') return;
    group.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    state[key] = e.target.dataset.value;
    render();
  });
}

setupFilterGroup('filter-side', 'side');
setupFilterGroup('filter-category', 'category');
setupFilterGroup('filter-status', 'status');
document.getElementById('filter-team').addEventListener('change', (e) => {
  state.team = e.target.value;
  render();
});

document.getElementById('week-toggle').addEventListener('click', (e) => {
  state.thisWeek = !state.thisWeek;
  e.target.classList.toggle('active', state.thisWeek);
  render();
});

document.getElementById('standings-jump').addEventListener('click', () => {
  document.getElementById('standings-section').scrollIntoView({ behavior: 'smooth' });
});

loadMatches();
</script>

</body>
</html>
